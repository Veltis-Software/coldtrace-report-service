spring.application.name=coldtrace-report-service
server.port=${PORT:8085}
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ct_report?serverTimezone=UTC}
spring.datasource.username=${DB_USER:ct_report}
spring.datasource.password=${DB_PASSWORD:}
spring.flyway.enabled=true
coldtrace.identity.url=${IDENTITY_URL:http://localhost:8081}
coldtrace.alert.url=${ALERT_URL:http://127.0.0.1:8084}
coldtrace.pubsub.local-push-enabled=false
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
spring.mvc.problemdetails.enabled=true
coldtrace.internal.service-key=${INTERNAL_SERVICE_KEY:}

coldtrace.ai.url=${AI_URL:http://localhost:8087}
coldtrace.asset.url=${ASSET_URL:http://localhost:8082}
coldtrace.subscription.url=${SUBSCRIPTION_URL:http://localhost:8088}
coldtrace.monitoring.url=${MONITORING_URL:http://localhost:8083}
coldtrace.maintenance.url=${MAINTENANCE_URL:http://localhost:8086}
